			<script type="application/json" data-sveltekit-fetched data-url="https://ochre.uchicago.edu/digs30005-poetry-database">{"status":200,"statusText":"OK","headers":{},"body":"[{\"name\":\"Edgar Allan Poe\",\"poemTitles\":[\"A Dream\",\"A Dream Within A Dream\",\"A Pæan\",\"A Valentine\",\"Al Aaraaf\",\"An Enigma\",\"Annabel Lee\",\"Bridal Ballad\",\"Dreamland\",\"Dreams\",\"Eldorado\",\"Eulalie\",\"Evening Star\",\"Fairyland\",\"For Annie\",\"Hymn\",\"Hymn To Aristogeiton And Harmodius\",\"Imitation\",\"In Youth I Have Known One\",\"Israfel\",\"Lenore\",\"Romance\",\"Silence\",\"Song\",\"Sonnet--To Science\",\"Spirits Of The Dead\",\"Tamerlane\",\"The Bells\",\"The City In The Sea\",\"The Coliseum\",\"The Conqueror Worm\",\"The Happiest Day\",\"The Haunted Palace\",\"The Lake\",\"The Raven\",\"The Sleeper\",\"The Valley Of Unrest\",\"To F--\",\"To Frances S. Osgood\",\"To Helen\",\"To Helen\",\"To Marie Louise (Shew)\",\"To Marie Louise (Shew)\",\"To My Mother\",\"To One In Paradise\",\"To The River\",\"To Zante\",\"To----\",\"To----\",\"Ulalume\"],\"poemCount\":50},{\"name\":\"Emily Dickinson\",\"poemTitles\":[\"'Tis One by One -- the Father counts --\",\"'Twas a long Parting -- but the time\",\"'Twas here my summer paused\",\"'Twas just this time, last year, I died.\",\"'Twas later when the summer went\",\"'Twould ease -- a Butterfly --\",\"\\\"Arcturus\\\" is his other name\",\"\\\"Faith\\\" is a fine invention\",\"\\\"Faithful to the end\\\" Amended\",\"\\\"Heaven\\\" -- is what I cannot reach!\",\"\\\"Heaven\\\" has different Signs -- to me --\",\"\\\"Heavenly Father\\\" -- take to thee\",\"\\\"Hope\\\" is the thing with feathers\",\"\\\"Lethe\\\" in my flower,\",\"\\\"Nature\\\" is what we see --\",\"A chilly Peace infests the Grass\",\"A Death blow is a Life blow to Some\",\"A Door just opened on a street --\",\"A Drop Fell on the Apple Tree --\",\"A Flower will not trouble her, it has so small a Foot,\",\"A full fed Rose on meals of Tint\",\"A great Hope fell\",\"A happy lip -- breaks sudden\",\"A Light exists in Spring\",\"A little Dog that wags his tail\",\"A little Madness in the Spring\",\"A little Snow was here and there\",\"A loss of something ever felt I --\",\"A Murmur in the Trees -- to note\",\"A Pang is more conspicuous in Spring\",\"A Pit -- but Heaven over it --\",\"A soft Sea washed around the House\",\"A something in a summer's Day\",\"A Tooth upon Our Peace\",\"A Wife -- at daybreak I shall be\",\"A Wind that rose\",\"Absent Place -- an April Day --\",\"Ah, Moon -- and Star!\",\"All but Death, can be Adjusted --\",\"An Antiquated Tree\",\"And this of all my Hopes\",\"Angels, in the early morning\",\"As Children bid the Guest \\\"Good Night\\\"\",\"As if some little Arctic flower\",\"As if the Sea should part\",\"As Sleigh Bells seem in summer\",\"As Summer into Autumn slips\",\"As the Starved Maelstrom laps the Navies\",\"Autumn -- overlooked my Knitting --\",\"Away from Home are some and I --\",\"Beauty -- be not caused -- It Is --\",\"Beauty crowds me till I die\",\"Before you thought of Spring\",\"Bereavement in their death to feel\",\"Besides the Autumn poets sing\",\"Better -- than Music! For I -- who heard it --\",\"Between the form of Life and Life\",\"Birthday of but a single pang\",\"Bless God, he went as soldiers,\",\"Bliss is the plaything of the child --\",\"Bloom -- is Result -- to meet a Flower\",\"Brother of Ingots -- Ah Peru --\",\"By a flower -- By a letter\",\"By homely gift and hindered Words\",\"Consulting summer's clock,\",\"Could Hope inspect her Basis\",\"Could that sweet Darkness where they dwell\",\"Death is a Dialogue between\",\"Death leaves Us homesick, who behind,\",\"Declaiming Waters none may dread --\",\"Defrauded I a Butterfly --\",\"Did life's penurious length\",\"Did Our Best Moment last\",\"Do People moulder equally,\",\"Dying at my music!\",\"Dying! Dying in the night!\",\"Each Life Converges to some Centre --\",\"Estranged from Beauty -- none can be --\",\"Except the Heaven had come so near\",\"Except to Heaven, she is nought.\",\"Expanse cannot be lost --\",\"Faith -- is the Pierless Bridge\",\"Fame's Boys and Girls, who never die\",\"Far from Love the Heavenly Father\",\"Floss won't save you from an Abyss\",\"Flowers -- Well -- if anybody\",\"For Death -- or rather\",\"For largest Woman's Hearth I knew\",\"Forbidden Fruit A Flavor Has\",\"Forever honored by the Tree\",\"Four Trees -- upon a solitary Acre --\",\"From all the Jails the Boys and Girls\",\"From Cocoon forth a Butterfly\",\"Funny -- to be a Century\",\"Further in Summer than the Birds\",\"Given in Marriage unto Thee\",\"Glass was the Street -- in tinsel Peril\",\"Go not too near a House of Rose --\",\"God permits industrious Angels\",\"Going to Heaven!\",\"Going to Him! Happy letter!\",\"Great Streets of silence led away\",\"Growth of Man -- like Growth of Nature --\",\"Had I presumed to hope --\",\"He put the Belt around my life\",\"He strained my faith\",\"He told a homely tale\",\"Heaven is so far of the Mind\",\"Her final Summer was it --\",\"Her sovereign People\",\"Her spirit rose to such a height\",\"Her Sweet turn to leave the Homestead\",\"His Heart was darker than the starless night\",\"Hope is a strange invention --\",\"Hope is a subtle Glutton --\",\"How far is it to Heaven?\",\"How happy I was if I could forget\",\"How happy is the little Stone\",\"How Human Nature dotes\",\"How know it from a Summer's Day?\",\"How many Flowers fail in Wood\",\"How much the present moment means\",\"How the Waters closed above Him\",\"I cannot dance upon my Toes\",\"I cannot meet the Spring unmoved --\",\"I cried at Pity -- not at Pain --\",\"I died for Beauty -- but was scarce\",\"I felt a Funeral, in my Brain,\",\"I felt my life with both my hands\",\"I got so I could take his name\",\"I had no time to Hate\",\"I have a Bird in spring\",\"I hide myself within my flower,\",\"I know a place where Summer strives\",\"I know of people in the Grave\",\"I know some lonely Houses off the Road\",\"I learned -- at least -- what Home could be --\",\"I lost a World -- the other day!\",\"I many times thought Peace had come\",\"I never felt at Home -- Below\",\"I never lost as much but twice\",\"I noticed People disappeared\",\"I prayed, at first, a little Girl,\",\"I rose -- because He sank --\",\"I saw no Way -- The Heavens were stitched\",\"I see thee better -- in the Dark --\",\"I send you a decrepit flower\",\"I started Early -- Took my Dog --\",\"I suppose the time will come\",\"I tend my flowers for thee\",\"I think that the Root of the Wind is Water --\",\"I thought that nature was enough\",\"I watched the Moon around the House\",\"I went to Heaven\",\"I Years had been from Home\",\"I'll tell you how the Sun rose\",\"I'm \\\"wife\\\" -- I've finished that\",\"I'm sorry for the Dead -- Today --\",\"I've known a Heaven, like a Tent\",\"If I could bribe them by a Rose\",\"If I should cease to bring a Rose\",\"If I'm lost -- now\",\"If Nature smiles -- the Mother must\",\"If pain for peace prepares\",\"If the foolish, call them \\\"flowers\\\"\",\"Immured in Heaven!\",\"In snow thou comest --\",\"In this short Life\",\"In Winter in my Room\",\"Is Heaven a Physician?\",\"It can't be \\\"Summer\\\"!\",\"It sounded as if the Streets were running\",\"It will be Summer -- eventually.\",\"It would have starved a Gnat --\",\"Jesus! thy Crucifix\",\"Joy to have merited the Pain --\",\"Just so -- Jesus -- raps\",\"Lad of Athens, faithful be\",\"Lain in Nature -- so suffice us\",\"Lest this be Heaven indeed\",\"Lightly stepped a yellow star\",\"Like Flowers, that heard the news of Dews,\",\"Like Men and Women Shadows walk\",\"Like Rain it sounded till it curved\",\"Like Some Old fashioned Miracle\",\"Love -- is that later Thing than Death --\",\"Midsummer, was it, when They died --\",\"Musicians wrestle everywhere\",\"My Faith is larger than the Hills --\",\"My Garden -- like the Beach\",\"My life closed twice before its close --\",\"My period had come for Prayer --\",\"My Season's furthest Flower --\",\"My wheel is in the dark!\",\"Nature -- sometimes sears a Sapling\",\"Nature -- the Gentlest Mother is,\",\"Nature affects to be sedate\",\"Nature and God -- I neither knew\",\"Nature assigns the Sun --\",\"Nature can do no more\",\"Nature rarer uses Yellow\",\"No Autumn's intercepting Chill\",\"No Romance sold unto\",\"Nobody knows this little Rose\",\"Not at Home to Callers\",\"Not One by Heaven defrauded stay --\",\"Now I knew I lost her --\",\"Of Life to own --\",\"Of Nature I shall have enough\",\"Oh Future! thou secreted peace\",\"Oh Sumptuous moment\",\"On this long storm the Rainbow rose\",\"One Day is there of the Series\",\"One Life of so much Consequence!\",\"One Sister have I in our house\",\"One Year ago -- jots what?\",\"Only God -- detect the Sorrow --\",\"Our journey had advanced --\",\"Our little Kinsmen -- after Rain\",\"Ourselves were wed one summer -- dear --\",\"Pain -- expands the Time --\",\"Pain -- has an Element of Blank --\",\"Pain has but one Acquaintance\",\"Peace is a fiction of our Faith --\",\"Perhaps you'd like to buy a flower,\",\"Prayer is the little implement\",\"Rearrange a \\\"Wife's\\\" affection!\",\"Remorse -- is Memory -- awake --\",\"Robbed by Death -- but that was easy --\",\"Said Death to Passion\",\"She rose as high as His Occasion\",\"She rose to His Requirement -- dropt\",\"She slept beneath a tree\",\"She sped as Petals of a Rose\",\"She's happy, with a new Content --\",\"Snow beneath whose chilly softness\",\"Snow flakes.\",\"So gay a Flower\",\"So give me back to Death --\",\"So much of Heaven has gone from Earth\",\"So much Summer\",\"Some such Butterfly be seen\",\"Some, too fragile for winter winds\",\"Somewhat, to hope for,\",\"Split the Lark -- and you'll find the Music --\",\"Spring comes on the World --\",\"Spring is the Period\",\"Success is counted sweetest\",\"Summer -- we all have seen --\",\"Summer begins to have the look\",\"Summer for thee, grant I may be\",\"Summer has two Beginnings --\",\"Summer is shorter than any one --\",\"Summer laid her simple Hat\",\"Suspense -- is Hostiler than Death --\",\"Take your Heaven further on\",\"Talk not to me of Summer Trees\",\"Teach Him -- When He makes the names\",\"Than Heaven more remote,\",\"The Bird her punctual music brings\",\"The Butterfly in honored Dust\",\"The butterfly obtains\",\"The Butterfly upon the Sky,\",\"The Butterfly's Assumption Gown\",\"The Butterfly's Numidian Gown\",\"The Child's faith is new --\",\"The Definition of Beauty is\",\"The Fact that Earth is Heaven --\",\"The fairest Home I ever knew\",\"The fascinating chill that music leaves\",\"The feet of people walking home\",\"The first Day that I was a Life\",\"The Flower must not blame the Bee\",\"The Frost of Death was on the Pane --\",\"The good Will of a Flower\",\"The Heaven vests for Each\",\"The inundation of the Spring\",\"The last of Summer is Delight --\",\"The Leaves like Women interchange\",\"The Life we have is very great.\",\"The Moon is distant from the Sea\",\"The Moon upon her fluent Route\",\"The Moon was but a Chin of Gold\",\"The Mountain sat upon the Plain\",\"The name -- of it -- is \\\"Autumn\\\" --\",\"The Notice that is called the Spring\",\"The One who could repeat the Summer day\",\"The pretty Rain from those sweet Eaves\",\"The Road was lit with Moon and star --\",\"The Rose did caper on her cheek\",\"The Sea said \\\"Come\\\" to the Brook --\",\"The Service without Hope --\",\"The Snow that never drifts --\",\"The Soul has Bandaged moments --\",\"The Stars are old, that stood for me --\",\"The stem of a departed Flower\",\"The Summer that we did not prize,\",\"The Sun and Moon must make their haste --\",\"The Sun is gay or stark\",\"The Trees like Tassels -- hit -- and swung --\",\"The Veins of other Flowers\",\"The waters chased him as he fled,\",\"The way Hope builds his House\",\"The Winters are so short\",\"The words the happy say\",\"Their Height in Heaven comforts not --\",\"There came a Day at Summer's full\",\"There is a flower that Bees prefer\",\"There is a pain -- so utter --\",\"These are the Signs to Nature's Inns --\",\"They say that \\\"Time assuages\\\" --\",\"They shut me up in Prose --\",\"This Chasm, Sweet, upon my life\",\"This is the place they hoped before,\",\"Tho' I get home how late -- how late\",\"Those fair -- fictitious People\",\"Though the great Waters sleep,\",\"Three times -- we parted -- Breath -- and I --\",\"Through the Dark Sod -- as Education\",\"Through those old Grounds of memory,\",\"Tie the Strings to my Life, My Lord,\",\"Time does go on --\",\"To flee from memory\",\"To her derided Home\",\"To lose one's faith -- surpass\",\"To mend each tattered Faith\",\"To see the Summer Sky\",\"To tell the Beauty would decrease\",\"Too happy Time dissolves itself\",\"Touch lightly Nature's sweet Guitar\",\"Trusty as the stars\",\"Twice had Summer her fair Verdure\",\"Undue Significance a starving man attaches\",\"Water makes many Beds\",\"Water, is taught by thirst.\",\"We dream -- it is good we are dreaming --\",\"We grow accustomed to the Dark\",\"We pray -- to Heaven\",\"We should not mind so small a flower\",\"We talked as Girls do --\",\"We thirst at first -- 'tis Nature's Act --\",\"What shall I do when the Summer troubles --\",\"Whatever it is -- she has tried it --\",\"When I hoped I feared --\",\"When I hoped, I recollect\",\"When I was small, a Woman died --\",\"When Memory is full\",\"When Roses cease to bloom, Sir,\",\"Where Roses would not dare to go,\",\"Where Thou art -- that -- is Home --\",\"Which is best?  Heaven --\",\"Which is the best -- the Moon or the Crescent?\",\"Who has not found the Heaven -- below --\",\"Who were \\\"the Father and the Son\\\"\",\"Why -- do they shut Me out of Heaven?\",\"Winter is good -- his Hoar Delights\",\"Winter under cultivation\",\"Witchcraft was hung, in History,\",\"Would you like summer?  Taste of ours.\",\"Yesterday is History,\",\"You know that Portrait in the Moon --\",\"You see I cannot see -- your lifetime\"],\"poemCount\":362},{\"name\":\"Oscar Wilde\",\"poemTitles\":[\"Ballade De Marguerite (Normande)\",\"CHARMIDES\",\"Easter Day\",\"ENDYMION (For music)\",\"From Spring Days To Winter (For Music)\",\"Nay, Lord, not thus! white lilies in the spring,\",\"Roses And Rue\",\"Serenade (For Music)\",\"The Ballad Of Reading Gaol\",\"To My Wife - With A Copy Of My Poems\"],\"poemCount\":10},{\"name\":\"William Shakespeare\",\"poemTitles\":[\"A Lover's Complaint\",\"Blow, Blow, Thou Winter Wind\",\"Orpheus with his Lute Made Trees\",\"Sonnet 1: From fairest creatures we desire increase\",\"Sonnet 10: For shame! deny that thou bear'st love to any\",\"Sonnet 100: Where art thou Muse that thou forget'st so long\",\"Sonnet 101: O truant Muse what shall be thy amends\",\"Sonnet 102: My love is strengthen'd, though more weak in seeming\",\"Sonnet 103: Alack! what poverty my Muse brings forth\",\"Sonnet 104: To me, fair friend, you never can be old\",\"Sonnet 105: Let not my love be call'd idolatry\",\"Sonnet 106: When in the chronicle of wasted time\",\"Sonnet 107: Not mine own fears, nor the prophetic soul\",\"Sonnet 108: What's in the brain, that ink may character\",\"Sonnet 109: O! never say that I was false of heart\",\"Sonnet 11: As fast as thou shalt wane, so fast thou grow'st\",\"Sonnet 110: Alas! 'tis true, I have gone here and there\",\"Sonnet 111: O! for my sake do you with Fortune chide\",\"Sonnet 112: Your love and pity doth the impression fill\",\"Sonnet 113: Since I left you, mine eye is in my mind\",\"Sonnet 114: Or whether doth my mind, being crown'd with you\",\"Sonnet 115: Those lines that I before have writ do lie\",\"Sonnet 116: Let me not to the marriage of true minds\",\"Sonnet 117: Accuse me thus: that I have scanted all\",\"Sonnet 118: Like as, to make our appetite more keen\",\"Sonnet 119: What potions have I drunk of Siren tears\",\"Sonnet 12: When I do count the clock that tells the time\",\"Sonnet 120: That you were once unkind befriends me now\",\"Sonnet 121: 'Tis better to be vile than vile esteem'd\",\"Sonnet 122: Thy gift, thy tables, are within my brain\",\"Sonnet 123: No, Time, thou shalt not boast that I do change\",\"Sonnet 124: If my dear love were but the child of state\",\"Sonnet 125: Were't aught to me I bore the canopy\",\"Sonnet 126: O thou, my lovely boy, who in thy power\",\"Sonnet 127: In the old age black was not counted fair\",\"Sonnet 128: How oft when thou, my music, music play'st\",\"Sonnet 129: The expense of spirit in a waste of shame\",\"Sonnet 13: O! that you were your self; but, love you are\",\"Sonnet 130: My mistress' eyes are nothing like the sun\",\"Sonnet 131: Thou art as tyrannous, so as thou art\",\"Sonnet 132: Thine eyes I love, and they, as pitying me\",\"Sonnet 133: Beshrew that heart that makes my heart to groan\",\"Sonnet 134: So, now I have confess'd that he is thine\",\"Sonnet 135: Whoever hath her wish, thou hast thy 'Will,'\",\"Sonnet 136: If thy soul check thee that I come so near\",\"Sonnet 137: Thou blind fool, Love, what dost thou to mine eyes\",\"Sonnet 138: When my love swears that she is made of truth\",\"Sonnet 139: O! call not me to justify the wrong\",\"Sonnet 14: Not from the stars do I my judgement pluck\",\"Sonnet 140: Be wise as thou art cruel; do not press\",\"Sonnet 141: In faith I do not love thee with mine eyes\",\"Sonnet 142: Love is my sin, and thy dear virtue hate\",\"Sonnet 143: Lo, as a careful housewife runs to catch\",\"Sonnet 144: Two loves I have of comfort and despair\",\"Sonnet 145: Those lips that Love's own hand did make\",\"Sonnet 146: Poor soul, the centre of my sinful earth\",\"Sonnet 147: My love is as a fever longing still\",\"Sonnet 148: O me! what eyes hath Love put in my head\",\"Sonnet 149: Canst thou, O cruel! say I love thee not\",\"Sonnet 15: When I consider every thing that grows\",\"Sonnet 150: O! from what power hast thou this powerful might\",\"Sonnet 151: Love is too young to know what conscience is\",\"Sonnet 152: In loving thee thou know'st I am forsworn\",\"Sonnet 153: Cupid laid by his brand and fell asleep\",\"Sonnet 154: The little Love-god lying once asleep\",\"Sonnet 16: But wherefore do not you a mightier way\",\"Sonnet 17: Who will believe my verse in time to come\",\"Sonnet 18: Shall I compare thee to a summer's day?\",\"Sonnet 19: Devouring Time, blunt thou the lion's paws\",\"Sonnet 2: When forty winters shall besiege thy brow\",\"Sonnet 20: A woman's face with nature's own hand painted\",\"Sonnet 21: So is it not with me as with that Muse\",\"Sonnet 22: My glass shall not persuade me I am old\",\"Sonnet 23: As an unperfect actor on the stage\",\"Sonnet 24: Mine eye hath play'd the painter and hath stell'd\",\"Sonnet 25: Let those who are in favour with their stars\",\"Sonnet 26: Lord of my love, to whom in vassalage\",\"Sonnet 27: Weary with toil, I haste me to my bed\",\"Sonnet 28: How can I then return in happy plight\",\"Sonnet 29: When in disgrace with fortune and men's eyes\",\"Sonnet 3: Look in thy glass and tell the face thou viewest\",\"Sonnet 30: When to the sessions of sweet silent thought\",\"Sonnet 31: Thy bosom is endeared with all hearts\",\"Sonnet 32: If thou survive my well-contented day\",\"Sonnet 33: Full many a glorious morning have I seen\",\"Sonnet 34: Why didst thou promise such a beauteous day\",\"Sonnet 35: No more be griev'd at that which thou hast done\",\"Sonnet 36: Let me confess that we two must be twain\",\"Sonnet 37: As a decrepit father takes delight\",\"Sonnet 38: How can my muse want subject to invent\",\"Sonnet 39: O! how thy worth with manners may I sing\",\"Sonnet 4: Unthrifty loveliness, why dost thou spend\",\"Sonnet 40: Take all my loves, my love, yea take them all\",\"Sonnet 41: Those pretty wrongs that liberty commits\",\"Sonnet 42: That thou hast her it is not all my grief\",\"Sonnet 43: When most I wink, then do mine eyes best see\",\"Sonnet 44: If the dull substance of my flesh were thought\",\"Sonnet 45: The other two, slight air, and purging fire\",\"Sonnet 46: Mine eye and heart are at a mortal war\",\"Sonnet 47: Betwixt mine eye and heart a league is took\",\"Sonnet 48: How careful was I when I took my way\",\"Sonnet 49: Against that time, if ever that time come\",\"Sonnet 5: Those hours, that with gentle work did frame\",\"Sonnet 50: How heavy do I journey on the way\",\"Sonnet 51: Thus can my love excuse the slow offence\",\"Sonnet 52: So am I as the rich, whose blessed key\",\"Sonnet 53: What is your substance, whereof are you made\",\"Sonnet 54: O! how much more doth beauty beauteous seem\",\"Sonnet 55: Not marble, nor the gilded monuments\",\"Sonnet 56: Sweet love, renew thy force; be it not said\",\"Sonnet 57: Being your slave what should I do but tend\",\"Sonnet 58: That god forbid, that made me first your slave\",\"Sonnet 59: If there be nothing new, but that which is\",\"Sonnet 6: Then let not winter's ragged hand deface\",\"Sonnet 60: Like as the waves make towards the pebbled shore\",\"Sonnet 61: Is it thy will, thy image should keep open\",\"Sonnet 62: Sin of self-love possesseth all mine eye\",\"Sonnet 63: Against my love shall be as I am now\",\"Sonnet 64: When I have seen by Time's fell hand defac'd\",\"Sonnet 65: Since brass, nor stone, nor earth, nor boundless sea\",\"Sonnet 66: Tired with all these, for restful death I cry\",\"Sonnet 67: Ah! wherefore with infection should he live\",\"Sonnet 68: Thus is his cheek the map of days outworn\",\"Sonnet 69: Those parts of thee that the world's eye doth view\",\"Sonnet 7: Lo! in the orient when the gracious light\",\"Sonnet 70: That thou art blam'd shall not be thy defect\",\"Sonnet 71: No longer mourn for me when I am dead\",\"Sonnet 72: O! lest the world should task you to recite\",\"Sonnet 73: That time of year thou mayst in me behold\",\"Sonnet 74: But be contented: when that fell arrest\",\"Sonnet 75: So are you to my thoughts as food to life\",\
